
name: Update README

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  markscribe:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install Markscribe
        run: go install github.com/taciturnaxolotl/markscribe@master

      - name: Generate README
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKATIME_URL: ${{ secrets.WAKATIME_URL }}
        run: |
          "$(go env GOPATH)/bin/markscribe" \
            -write README.md templates/README.md.tpl

      - name: Commit generated README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update coding stats"
          file_pattern: README.md
